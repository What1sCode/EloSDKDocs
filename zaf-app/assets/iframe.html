<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Elo SDK Docs</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #status {
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #68737d;
    }
    #docs-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      overflow: auto;
    }
  </style>
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
</head>
<body>
  <div id="status">Loading Elo SDK Docs...</div>
  <iframe id="docs-frame" allow="clipboard-write"></iframe>

  <script>
    (function () {
      var client = ZAFClient.init();
      var FIXED_HEIGHT = '900px';
      var docsOrigin = null;

      function setAppHeight() {
        client.invoke('resize', { width: '100%', height: FIXED_HEIGHT });
      }

      setAppHeight();

      client.on('app.activated', function () {
        setAppHeight();
      });

      // Listen for Insert into Ticket actions from the inner docs site
      window.addEventListener('message', function (event) {
        if (!docsOrigin || event.origin !== docsOrigin) return;
        var data = event.data;
        if (data && data.source === 'elo-sdk-docs') {
          if (data.action === 'insert_ticket' && typeof data.text === 'string') {
            client.invoke('ticket.comment.appendText', data.text + '\n\n');
          }
        }
      });

      // Retrieve settings & ticket context
      Promise.all([
        client.metadata(),
        client.get('ticket.subject').catch(function() { return {}; })
      ]).then(function (results) {
        var metadata = results[0];
        var ticketData = results[1] || {};
        var subject = ticketData['ticket.subject'] || '';

        var docsUrl = (metadata.settings && metadata.settings.docsUrl) ? metadata.settings.docsUrl : '';
        var frame = document.getElementById('docs-frame');
        var status = document.getElementById('status');

        if (!docsUrl) {
          status.textContent = 'Configuration error: "docsUrl" setting is missing in Zendesk App settings.';
          return;
        }

        docsUrl = docsUrl.replace(/\/+$/, '');
        try {
          docsOrigin = new URL(docsUrl).origin;
        } catch (e) {
          docsOrigin = docsUrl;
        }

        // Smart ticket context: Clean subject keywords for suggested search
        var cleanSubject = subject
          .replace(/^(re:|fwd:|\s*\[.*?\])/gi, '')
          .replace(/[^\w\s]/gi, ' ')
          .trim();

        var initialUrl = docsUrl + '/';
        if (cleanSubject && cleanSubject.length > 2) {
          // Pass first 3-4 significant words as suggestion
          var words = cleanSubject.split(/\s+/).slice(0, 3).join(' ');
          initialUrl += '?suggest=' + encodeURIComponent(words);
        }

        frame.src = initialUrl;

        frame.onload = function () {
          status.style.display = 'none';
          frame.style.display = 'block';
          setAppHeight();
        };

        frame.onerror = function () {
          status.textContent = 'Could not load documentation at ' + docsUrl;
        };
      }).catch(function (err) {
        document.getElementById('status').textContent = 'Failed to initialize: ' + (err && err.message ? err.message : err);
      });
    })();
  </script>
</body>
</html>
