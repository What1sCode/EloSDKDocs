<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Elo SDK Docs</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #status {
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #68737d;
    }
    #docs-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      overflow: auto;
    }
  </style>
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
</head>
<body>
  <div id="status">Loading Elo SDK Docs...</div>
  <iframe id="docs-frame" allow="clipboard-write"></iframe>

  <script>
    (function () {
      var client = ZAFClient.init();
      var FIXED_HEIGHT = '900px';

      function setAppHeight() {
        client.invoke('resize', { width: '100%', height: FIXED_HEIGHT });
      }

      // Initial resize call
      setAppHeight();

      // Re-apply height when ticket/app tab is focused or switched
      client.on('app.activated', function () {
        setAppHeight();
      });

      // Load documentation URL from app settings
      client.metadata().then(function (metadata) {
        var docsUrl = (metadata.settings && metadata.settings.docsUrl) ? metadata.settings.docsUrl : '';
        var frame = document.getElementById('docs-frame');
        var status = document.getElementById('status');

        if (!docsUrl) {
          status.textContent = 'Configuration error: "docsUrl" setting is missing.';
          return;
        }

        // Clean trailing slash
        docsUrl = docsUrl.replace(/\/+$/, '');
        frame.src = docsUrl + '/';

        frame.onload = function () {
          status.style.display = 'none';
          frame.style.display = 'block';
          setAppHeight();
        };

        frame.onerror = function () {
          status.textContent = 'Could not load documentation at ' + docsUrl + '. Please check the URL or host status.';
        };
      }).catch(function (err) {
        document.getElementById('status').textContent = 'Failed to initialize Zendesk App: ' + (err && err.message ? err.message : err);
      });
    })();
  </script>
</body>
</html>
