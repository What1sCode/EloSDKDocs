<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Elo SDK Docs</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #docs-frame { width: 100%; height: 100%; border: 0; display: block; }
  #status { font: 13px -apple-system, sans-serif; padding: 12px; color: #666; }
</style>
</head>
<body>
<div id="status">Loading Elo SDK Docs…</div>
<iframe id="docs-frame" style="display:none;" title="Elo SDK Docs"></iframe>

<script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
<script>
(function () {
  var client = ZAFClient.init();
  var MIN_HEIGHT = 120;
  var FALLBACK_HEIGHT = 600; // used only until the docs page's first real measurement arrives
  var docsOrigin = null;
  var lastHeight = FALLBACK_HEIGHT;

  // Zendesk's resize() takes a literal pixel height and nothing else —
  // there's no "fill available space" or percentage mode (confirmed via
  // Zendesk's own community thread: 100%/100vh on either side of this call
  // are silently ignored). So the height we hand it has to be a real,
  // measured number, not a guess, or we're either leaving dead space below
  // short content or clipping tall content.
  function resize(px) {
    lastHeight = Math.max(Math.round(px), MIN_HEIGHT);
    client.invoke('resize', { width: '100%', height: lastHeight + 'px' });
  }

  // The docs page (Railway, a different origin from this Zendesk-hosted
  // wrapper) can't be measured directly — cross-origin — so it measures its
  // own scrollHeight and posts it up. Only accept messages from the exact
  // docsUrl origin we were configured with.
  window.addEventListener('message', function (event) {
    if (!docsOrigin || event.origin !== docsOrigin) return;
    var data = event.data;
    if (data && data.source === 'elo-sdk-docs' && typeof data.height === 'number') {
      resize(data.height);
    }
  });

  // Re-assert the last known height when this app tab regains focus —
  // switching tickets can otherwise leave a stale/zero measurement in
  // place until the docs page happens to re-report on its own.
  client.on('app.activated', function () {
    resize(lastHeight);
  });

  client.get('currentAccount').then(function () {
    return client.metadata();
  }).then(function (metadata) {
    var docsUrl = (metadata.settings && metadata.settings.docsUrl || '').replace(/\/+$/, '');
    var status = document.getElementById('status');
    var frame = document.getElementById('docs-frame');

    if (!docsUrl) {
      status.textContent = 'This app is missing its "docsUrl" setting. An admin needs to set it in the app configuration (Admin Center > Apps).';
      return;
    }

    try {
      docsOrigin = new URL(docsUrl).origin;
    } catch (e) {
      status.textContent = 'The configured "docsUrl" setting isn\'t a valid URL.';
      return;
    }

    frame.src = docsUrl + '/';
    frame.onload = function () {
      status.style.display = 'none';
      frame.style.display = 'block';
      resize(lastHeight);
    };
    frame.onerror = function () {
      status.textContent = 'Could not load the docs site at ' + docsUrl + '. It may be down or the URL may be wrong.';
    };
  }).catch(function (err) {
    document.getElementById('status').textContent = 'Failed to initialize: ' + (err && err.message ? err.message : err);
  });

  resize(FALLBACK_HEIGHT);
})();
</script>
</body>
</html>
