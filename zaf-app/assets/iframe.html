<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Elo SDK Docs</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    #status {
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #68737d;
    }
    #docs-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      overflow: auto;
    }
  </style>
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
</head>
<body>
  <div id="status">Loading Elo SDK Docs...</div>
  <iframe id="docs-frame" allow="clipboard-write"></iframe>

  <script>
    (function () {
      var client = ZAFClient.init();
      var FIXED_HEIGHT = '900px';
      var docsOrigin = null;

      // Dictionary of recognized Elo SDK domain keywords & aliases
      var SDK_KEYWORDS = [
        // Peripherals & Modules
        'nfc', 'rfid', 'mifare', 'contactless', 'smartcard', 'cardreader',
        'barcode', 'scanner', 'bcr', 'symbology', 'scan', 'camera', 'aimer',
        'led', 'light', 'lightbar', 'statuslight', 'illumination', 'rgb', 'color',
        'drawer', 'cashdrawer', 'cash', 'paypoint', 'till',
        'printer', 'receipt', 'posprinter', 'thermal', 'cutter',
        'msr', 'magstripe', 'swipe', 'fingerprint', 'biometric',
        'cfd', 'display', 'screen', 'monitor', 'customerfacing',
        // System & Kiosk Actions
        'kiosk', 'lockdown', 'navigation', 'statusbar', 'navbar', 'systemui',
        'reboot', 'restart', 'power', 'shutdown', 'powerstate', 'boot', 'reset',
        'eloview', 'cloud', 'provision', 'apk', 'install', 'ota',
        'ethernet', 'wifi', 'network', 'ip', 'serial', 'usb', 'bluetooth',
        // Common Programming Entities
        'callback', 'listener', 'service', 'intent', 'broadcast', 'permission'
      ];

      function setAppHeight() {
        client.invoke('resize', { width: '100%', height: FIXED_HEIGHT });
      }

      setAppHeight();

      client.on('app.activated', function () {
        setAppHeight();
      });

      // Handle insertion actions from inner documentation iframe
      window.addEventListener('message', function (event) {
        if (!docsOrigin || event.origin !== docsOrigin) return;
        var data = event.data;
        if (data && data.source === 'elo-sdk-docs') {
          if (data.action === 'insert_ticket' && typeof data.text === 'string') {
            client.invoke('ticket.comment.appendText', data.text + '\n\n');
          }
        }
      });

      // Extracts only relevant SDK keywords from ticket subject
      function extractSdkKeywords(subject) {
        if (!subject || typeof subject !== 'string') return '';

        // Normalize text: lowercase, remove punctuation and email prefixes
        var normalized = subject
          .toLowerCase()
          .replace(/^(re:|fwd:|\s*\[.*?\])/gi, '')
          .replace(/[^a-z0-9\s-_]/g, ' ');

        var tokens = normalized.split(/\s+/);
        var matched = [];

        tokens.forEach(function(token) {
          if (!token || token.length < 2) return;
          // Check if token matches or contains any known SDK keyword
          for (var i = 0; i < SDK_KEYWORDS.length; i++) {
            var kw = SDK_KEYWORDS[i];
            if (token === kw || (token.length > 3 && (token.indexOf(kw) !== -1 || kw.indexOf(token) !== -1))) {
              if (matched.indexOf(kw) === -1) {
                matched.push(kw);
              }
              break;
            }
          }
        });

        // Limit to top 3 most specific keywords to avoid over-filtering
        return matched.slice(0, 3).join(' ');
      }

      // Initialize app and load inner docs iframe
      Promise.all([
        client.metadata(),
        client.get('ticket.subject').catch(function() { return {}; })
      ]).then(function (results) {
        var metadata = results[0];
        var ticketData = results[1] || {};
        var rawSubject = ticketData['ticket.subject'] || '';

        var docsUrl = (metadata.settings && metadata.settings.docsUrl) ? metadata.settings.docsUrl : '';
        var frame = document.getElementById('docs-frame');
        var status = document.getElementById('status');

        if (!docsUrl) {
          status.textContent = 'Configuration error: "docsUrl" setting is missing in Zendesk App settings.';
          return;
        }

        docsUrl = docsUrl.replace(/\/+$/, '');
        try {
          docsOrigin = new URL(docsUrl).origin;
        } catch (e) {
          docsOrigin = docsUrl;
        }

        var matchedKeywords = extractSdkKeywords(rawSubject);
        var targetUrl = docsUrl + '/';

        if (matchedKeywords) {
          targetUrl += '?suggest=' + encodeURIComponent(matchedKeywords);
        }

        frame.src = targetUrl;

        frame.onload = function () {
          status.style.display = 'none';
          frame.style.display = 'block';
          setAppHeight();
        };

        frame.onerror = function () {
          status.textContent = 'Could not load documentation at ' + docsUrl;
        };
      }).catch(function (err) {
        document.getElementById('status').textContent = 'Failed to initialize Zendesk App: ' + (err && err.message ? err.message : err);
      });
    })();
  </script>
</body>
</html>
